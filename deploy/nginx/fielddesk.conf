# Business requests are limited per authenticated account by the API.
# Do not pool all technicians behind one NAT into a small shared-IP bucket.
# Login/anonymous IP limits and concurrent upload admission remain in the API.
server {
  listen 80;
  server_name fielddesk.example.com;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name fielddesk.example.com;
  ssl_certificate /etc/letsencrypt/live/fielddesk.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fielddesk.example.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Base64 expands a 100,000,000-byte file to about 134 MB of JSON.
  client_max_body_size 140m;
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location / { root /opt/fielddesk/frontend/dist; try_files $uri /index.html; }
}
