limit_req_zone $binary_remote_addr zone=fielddesk_api:10m rate=10r/s;
server {
  listen 80;
  server_name fielddesk.example.com;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name fielddesk.example.com;
  ssl_certificate /etc/letsencrypt/live/fielddesk.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/fielddesk.example.com/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 30m;
  location /api/ {
    limit_req zone=fielddesk_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location / { root /opt/fielddesk/frontend/dist; try_files $uri /index.html; }
}
